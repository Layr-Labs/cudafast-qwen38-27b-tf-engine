# Engine CI -- build and test only, hosted, with no credential.
#
#   - no credential of any kind, and a step below trips if a workflow in this
#     tree starts referencing one, inheriting the caller's, or asking for a
#     write permission;
#   - no artifact upload (tools/ci-workflow-egress-scan.sh fails on any, and
#     on anything but one narrow score.json upload in the ranked pipeline);
#   - no submodule: the TensorFold engine is VENDORED as plain files and benchd is a
#     channel prebuilt (tools/fetch-benchd.sh);
#   - no model weights, no R2, no ranked box.
#
# ONE JOB:
#   `lint`            hosted x86 Ubuntu: hygiene, manifest lint, and selected
#                     GPU-free control-plane tests.
#
# The ranked pipeline is .github/workflows/benchmark.yml (workflow_dispatch
# only, self-hosted, no credential), which benchmark.json's runner.workflow
# names. It is never in this file.

# MANUAL ONLY. This repository uses no paid GitHub feature, and
# these jobs need GitHub-hosted runners, so they run only when dispatched by
# hand. Run the same checks locally before a push (AGENTS.md, "Checks").

name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (repo hygiene, hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: false
          persist-credentials: false
          # FULL HISTORY: the ranked preflight's paired-baseline cases build
          # their scaffold by cloning this checkout at HEAD and adding a commit
          # on top. A shallow fetch is enough today; the full fetch keeps the
          # cases independent of how many commits the repository has.
          fetch-depth: 0

      - name: No workflow takes a credential or ships a file out
        # The tripwire under the constraint that keeps organizer material
        # inside the runner. The scan lives in tools/ so its patterns are not
        # inside the directory it scans.
        run: tools/ci-workflow-egress-scan.sh

      - name: actionlint
        # A pinned release BINARY, hash-verified before it is allowed to run.
        # The org's Actions policy admits GitHub-owned actions by 40-hex SHA
        # plus an explicit allow-list, and a `docker://` reference is on
        # neither list, so the linter is not run as a container.
        #
        # A mutable reference would be a remote party's ability to change what
        # executes in this job, so: the version is fixed, the release
        # tarball's sha256 is hardcoded here, and the binary runs ONLY if the
        # hash it actually has matches. A swapped, tampered, or truncated
        # asset fails the step instead of executing.
        #
        # Kept at the known-good 1.7.12 pin. Bump the version and checksum
        # together; the checksum is the matching line from that release's
        # actionlint_<version>_checksums.txt.
        env:
          ACTIONLINT_VERSION: 1.7.12
          # linux amd64 because this job is `runs-on: ubuntu-latest`. Pick the
          # asset that matches the runner if that ever changes.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          tarball="${workdir}/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --silent --show-error --location --retry 3 -o "${tarball}" "${url}"

          # Fail closed, and verify BEFORE extracting or executing anything:
          # an unverified binary must never get a chance to run.
          if ! printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${tarball}" | sha256sum --check --status; then
            echo "::error::actionlint ${ACTIONLINT_VERSION} tarball does not match its pinned sha256; refusing to execute it" >&2
            echo "  expected ${ACTIONLINT_SHA256}" >&2
            echo "  actual   $(sha256sum "${tarball}" | cut -d ' ' -f 1)" >&2
            exit 1
          fi
          echo "ok: actionlint ${ACTIONLINT_VERSION} matches its pinned sha256"

          tar -xzf "${tarball}" -C "${workdir}" actionlint
          chmod +x "${workdir}/actionlint"

          # The same invocation the container ran: the image's entrypoint IS
          # actionlint, and `-color` was the whole of its `args:`.
          "${workdir}/actionlint" -color

      - name: Shell syntax and shellcheck
        # Every tracked *.sh is bash or sh. A zsh or other shebang hits the
        # `*)` arm and fails the run loudly rather than going unchecked.
        #
        # THE VENDORED ENGINE IS EXCLUDED. Vendor/TensorFold is upstream code
        # carried in this repository. This job checks the control-plane scripts;
        # the ranked box builds and checks the native engine.
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "${script}")" in
              '#!/usr/bin/env bash'|'#!/bin/bash')
                bash -n "${script}"
                ;;
              '#!/usr/bin/env sh'|'#!/bin/sh')
                sh -n "${script}"
                ;;
              *)
                echo "unsupported shell script interpreter: ${script}" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z '*.sh' ':!:Vendor/TensorFold/**')

          # The sweep. Its tool ships in the hosted image, so this adds no
          # download and no egress. The whole tree passes at warning severity
          # today; the gate keeps it that way. A script that needs an exception
          # carries an inline suppression with the reason next to it.
          #
          # No comment in this block may start with the tool's own name: the
          # workflow linter shellchecks these run blocks, and a comment that
          # opens that way is read as a malformed directive.
          shellcheck --version
          git ls-files -z '*.sh' ':!:Vendor/TensorFold/**' | xargs -0 shellcheck -S warning

      - name: Benchmark manifest lint
        run: |
          set -euo pipefail
          # --gitlink-targets report downgrades a command target missing ONLY
          # because its submodule is not checked out. Since benchd became a
          # pinned PREBUILT there is no submodule and every command target lives
          # in this repository, so nothing is downgraded and all three commands
          # are fully verified here. See docs/ci-coverage.md.
          python3 tools/lint-benchmark-manifest.py --gitlink-targets report

      - name: Public ranked log redaction
        run: tools/test-public-log-redact.sh

      - name: Editable archive stays below 20 MiB
        run: tools/check-editable-archive-size.sh

      - name: Editable archive size gate tests
        run: tools/test-editable-archive-size.sh

      - name: benchd platform gate
        run: tools/test-fetch-benchd-platform.sh

      - name: benchd channel second binary (record-correctness-golden)
        run: tools/test-fetch-benchd-recorder.sh

      - name: Docs agree with the manifest
        # TASK.md, README.md, AGENTS.md and the contract must state the same
        # editable paths, depth envelope and scoring constants as
        # benchmark.json and the track fixture.
        run: python3 tools/check-doc-consistency.py

      - name: Participant may edit the engine (manifest and static review)
        run: tools/test-participant-engine-edit.sh

      - name: Resident boot/stop verbs (per-leg serve convention)
        run: tools/test-serve-up-boot-stop.sh

      - name: Adapter keyring guard (kernel keyring calls denied)
        run: tools/test-no-keyring-exec.sh

      - name: Adapter wrapper (sudo, prlimit, keyring guard and its proof file)
        run: tools/test-run-engine-sandboxed.sh

      - name: Sandbox wipe (files, IPC, kernel keyrings)
        run: tools/test-sandbox-wipe.sh

      - name: Serve memory plan
        run: tools/test-serve-up-plan-memory.sh

      - name: Benchmark facade exports the track id
        run: tools/test-benchmark-facade-env.sh

      - name: Setup fills and verifies the target snapshot, and reruns read no shard
        run: tools/test-setup-onboarding.sh

      - name: Local baseline entry point reaches benchd
        run: tools/test-local-baseline.sh

      - name: yukon run selects the ranked or the local path
        run: tools/test-yukon-run.sh

      - name: Speculative declaration envelope
        run: tools/test-spec-declaration.sh

      - name: Ranked preflight refusals (environment + paired baseline)
        run: tools/test-ranked-box-preflight-env.sh

      - name: Leaked resident cleanup (GPU lock, exact name match)
        run: tools/test-stop-leaked-residents.sh

      - name: Per-box baseline calibrator mechanics
        run: tools/test-calibrate-box.sh

      - name: Reference-workspace stager plan
        run: tools/test-stage-baseline-workspace.sh

      - name: Golden fetcher
        run: tools/test-fetch-goldens.sh

      - name: Public golden recorder
        run: tools/test-record-goldens.sh

      - name: Scored-prompt draw and rotation
        run: tools/test-live-golden-rotation.sh

      - name: Pool refresh and stitched prompts
        run: tools/test-pool-refresh.sh && python3 tools/test_stitch_prompts.py

      - name: Box runner supervisor
        run: tools/box-runner/test/test-box-runner.sh
